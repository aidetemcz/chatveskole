# Ceny a tarify chatbotů pro stránku Začínáme → Kolik stojí chatboti.
# Stav: 15. 11. 2026 (Claude for Nonprofits doplněno 21. 11. 2026; ceny ChatGPT Go a Plus, Perplexity Education Pro a trénink u Copilotu ověřeny 21. 11. 2026), ověřeno v oficiálních cenících a nápovědách vývojářů (část jen z výsledků vyhledávání, stránky chatgpt.com, help.openai.com, gemini.google a perplexity.ai nešly přímo otevřít). Ceny jsou orientační, vč. DPH u spotřebitelských tarifů v Kč, jinak bez DPH.
# ⚠ = údaj z neoficiálního nebo staršího zdroje, před zveřejněním ověřit.
# Dovednosti v ChatGPT od tarifu Plus a pluginy z adresáře i ve Free a Go: opraveno podle Evy 20. 11. 2026.
# Trénink = zda vývojář smí použít vaše konverzace k učení modelů.

aktualizovano: 2026-11-21
nastroje:
  - id: chatgpt
    nazev: ChatGPT
    vyrobce: OpenAI
    cenik: https://chatgpt.com/pricing
    tarify:
      - nazev: Free
        cena: 0 Kč
        pozn: Omezený počet zpráv, obrázků a souborů, projekty (5 souborů na projekt). S reklamami (ne pro uživatele do 18 let), pluginy jen z adresáře, bez samostatných dovedností a Sites.
      - nazev: Go
        cena: 200 Kč měsíčně
        pozn: Víc zpráv a souborů než Free, bez nejsilnějšího modelu, s reklamami. Pluginy jen z adresáře, bez samostatných dovedností a Sites, hloubkový výzkum jen omezeně.
      - nazev: Plus
        cena: 499 Kč měsíčně
        pozn: Bez reklam, s hloubkovým výzkumem, pluginy, dovednostmi a ChatGPT Work.
      - nazev: Pro
        cena: od 100 $ měsíčně (tarify 100, 200 a 500 $), jen měsíční platba
        pozn: Pro náročné uživatele a programování, vyšší limity než Plus, dovednosti.
      - nazev: Edu
        cena: na dotaz
        pozn: Jen pro vysoké školy. ChatGPT for Teachers je jen pro vyučující v USA.
    trenink: U osobních tarifů ano, dá se vypnout v Nastavení → Ovládání dat. Business a Edu ne.
    zdroje:
      - https://ailadies.cz/knihovna/kolik-stoji-chatgpt-a-kdy-se-ti-vyplati-plus
      - https://www.aifirst.cz/pruvodce/kolik-stoji-chatgpt
      - https://chatgpt.com/pricing
      - https://help.openai.com/en/articles/5722486
      - https://help.openai.com/en/articles/11989085-what-is-chatgpt-go
      - https://help.openai.com/en/articles/20001066-skills-in-chatgpt
      - https://help.openai.com/en/articles/20001256-plugins-in-chatgpt
      - https://help.openai.com/en/articles/20001497-troubleshooting-plugins-and-apps-in-chatgpt
      - https://help.openai.com/en/articles/9793128-about-chatgpt-pro-tiers
      - https://help.openai.com/en/articles/8542115-chatgpt-business-general-faq
      - https://help.openai.com/en/articles/20001047-ads-in-chatgpt
      - https://help.openai.com/en/articles/12844995-chatgpt-for-teachers
      - https://openai.com/index/chatgpt-ads-expands-across-europe/

  - id: gemini
    nazev: Google Gemini
    vyrobce: Google
    cenik: https://gemini.google/cz/subscriptions/?hl=cs
    tarify:
      - nazev: Zdarma
        cena: 0 Kč
        pozn: Obrázky, Canvas, Gemini Notebook (dříve NotebookLM), hloubkový výzkum s denním limitem. Hloubkový výzkum a dovednosti jen od 18 let.
      - nazev: Google AI Plus
        cena: 150 Kč měsíčně
        pozn: Dvojnásobné limity proti verzi zdarma, 400 GB úložiště. Jen 18+. Studenti vysokých škol v ČR (18+, ověření přes SheerID, jen osobní účet Google) ho mají rok zdarma, pokud nabídku uplatní do 31. 12. 2026; pak se platí běžná cena.
      - nazev: Google AI Pro
        cena: 550 Kč měsíčně
        pozn: Model Pro, čtyřnásobné limity, video, 5 TB úložiště. Jen 18+.
      - nazev: Google AI Ultra
        cena: od 3 000 Kč měsíčně (vyšší tarif 5 500 Kč)
        pozn: Pro profesionály, nejvyšší limity. Jen 18+.
      - nazev: Google Workspace for Education
        cena: zdarma pro školy
        pozn: Gemini a Gemini Notebook ve všech edicích. Data se nepoužívají k tréninku a nečtou je lidé. Pro žáky do 18 let přísnější pravidla obsahu, zapíná správce.
    trenink: U osobních účtů se zapnutou historií aktivity ano (část konverzací čtou lidé), dá se vypnout. Školní účty ne.
    zdroje:
      - https://gemini.google/cz/subscriptions/?hl=cs
      - https://gemini.google/subscriptions/
      - https://gemini.google/cz/students/?hl=cs
      - https://blog.google/innovation-and-ai/products/gemini-app/student-offer-google-ai/
      - https://support.google.com/googleone/answer/17422238?hl=cs
      - https://support.google.com/gemini/answer/15719111
      - https://support.google.com/gemini/answer/17094296
      - https://support.google.com/googleone/answer/16548195
      - https://knowledge.workspace.google.com/admin/getting-started/editions/quickstart-guide-to-gemini-and-gemini-notebook-for-education
      - https://knowledge.workspace.google.com/admin/generative-ai/workspace-with-gemini/gemini-for-google-workspace-faq-education
      - https://support.google.com/gemini/answer/13594961

  - id: copilot
    nazev: Microsoft Copilot
    vyrobce: Microsoft
    cenik: https://www.microsoft.com/cs-cz/microsoft-365-copilot/pricing/individuals
    tarify:
      - nazev: Copilot (aplikace) a Copilot Chat se školním účtem
        cena: 0 Kč
        pozn: Se školní licencí A1/A3/A5 zdarma; data zůstávají ve škole a netrénuje se na nich. Agenti jen s pokyny a webem, bez přístupu k datům školy a bez Copilota ve Wordu a Excelu.
      - nazev: Microsoft 365 Personal
        cena: 269 Kč měsíčně / 2 699 Kč ročně
        pozn: Copilot ve Wordu, Excelu, PowerPointu a Outlooku. Bez agentů pro výzkum a analýzu.
      - nazev: Microsoft 365 Premium
        cena: 549 Kč měsíčně / 5 489 Kč ročně
        pozn: Vyšší limity, agenti pro výzkum a analýzu. Pro až 6 osob, Copilot ale jen pro vlastníka předplatného.
      - nazev: Microsoft 365 Pro
        cena: 2 699 Kč měsíčně, jen měsíční platba
        pozn: Jako Premium, ale nejvyšší limity Copilotu a 5 TB úložiště (Premium 2 TB). Copilot jen pro vlastníka předplatného, roční platba není.
      - nazev: Microsoft 365 Copilot (licence pro školy)
        cena: 18 $ za uživatele měsíčně
        pozn: Copilot nad daty školy, dovednosti, Agent Builder s daty. Cowork jen pro vyučující a zaměstnance, navíc za kredity.
    trenink: Na datech uživatelů do 18 let a na školních a pracovních účtech Microsoft netrénuje. U osobních účtů v EU zatím netrénuje ani nenabízí volbu tréninku (oznámení Microsoftu z roku 2024).
    zdroje:
      - https://www.microsoft.com/en-us/microsoft-copilot/blog/2024/08/16/transparency-and-control-in-consumer-data-use/
      - https://www.microsoft.com/cs-cz/microsoft-365-copilot/pricing/individuals
      - https://www.microsoft.com/cs-cz/microsoft-365/buy/compare-all-microsoft-365-products
      - https://www.microsoft.com/en-us/education/products/copilot-in-education
      - https://learn.microsoft.com/en-us/copilot/cowork/cowork-faq
      - https://techcommunity.microsoft.com/blog/EducationBlog/introducing-education-for-cowork/4565876
      - https://support.microsoft.com/en-us/microsoft-copilot/privacy-faq-for-microsoft-copilot

  - id: claude
    nazev: Claude
    vyrobce: Anthropic
    cenik: https://claude.com/pricing
    tarify:
      - nazev: Free
        cena: 0 Kč
        pozn: Projekty (nejvýš 5), dovednosti, konektory, paměť, Docs, Slides a Design, zveřejnění artefaktu odkazem. Bez hloubkového výzkumu (Research), pluginů, naplánovaných úloh a Claude Code.
      - nazev: Pro a Team
        cena: 20 $ měsíčně (17 $ při ročním placení); Team od 25 $ za uživatele měsíčně (20 $ ročně), 2–150 míst
        pozn: Hloubkový výzkum, Claude Code, samostatná práce na úkolech, pluginy, naplánované úlohy, neomezeně projektů. Team navíc sdílení projektů, dovedností a pluginů v rámci organizace a data se nepoužívají k tréninku.
      - nazev: Max a Ultra
        cena: 100 $ nebo 200 $ měsíčně, jen měsíční platba
        pozn: Pětinásobné (Max) nebo desetinásobné (Ultra) limity proti Pro.
      - nazev: Team pro školy (Claude for Nonprofits)
        cena: 8 $ za uživatele měsíčně, místo s pětinásobným využitím 40 $, 2–150 míst, měsíční platba
        pozn: Neziskové ceny i pro základní a střední školy. Škola se nejdřív ověří u partnera Goodstack, ověřuje člověk se školním e-mailem. Chat, Cowork a Claude Code. Jen od 18 let, pro vedení a pedagogy. Vysoké školy mají Claude for Education (cena na dotaz), bezplatný Claude for Teachers je zatím jen v USA.
    trenink: U Free, Pro, Max a Ultra rozhodujete sami (přepínač „Help improve Claude“). Team a tarify pro školy ne.
    zdroje:
      - https://claude.com/pricing
      - https://validate.poweredbypercent.com/anthropic
      - informace od Anthropicu k Claude for Nonprofits pro školy (Eva, 21. 11. 2026)
      - https://support.claude.com/en/articles/12512180-use-skills-in-claude
      - https://support.claude.com/en/articles/13837440-use-plugins-in-claude
      - https://support.claude.com/en/articles/9547008-publish-and-share-artifacts
      - https://support.claude.com/en/articles/17728952-what-is-the-ultra-plan
      - https://support.claude.com/en/articles/15171100-age-assurance-on-claude
      - https://www.anthropic.com/news/updates-to-our-consumer-terms

  - id: perplexity
    nazev: Perplexity
    vyrobce: Perplexity AI
    cenik: https://www.perplexity.ai/hub/pricing
    tarify:
      - nazev: Free
        cena: 0 Kč
        pozn: Vyhledávání s citacemi zdrojů, hloubkový výzkum jen jednou měsíčně. Od 13 let, nezletilí se souhlasem zákonného zástupce.
      - nazev: Pro
        cena: 20 $ měsíčně nebo 200 $ ročně
        pozn: Silnější modely, víc hloubkových rešerší, projekty a práce se soubory.
      - nazev: Max
        cena: 200 $ měsíčně nebo 2 000 $ ročně (roční platba jen na webu)
        pozn: Vše z Pro, navíc nejsilnější modely, vyšší limity a nové funkce dřív.
      - nazev: Education Pro
        cena: 10 $ měsíčně
        pozn: Pro studenty a vyučující vysokých škol s ověřením (SheerID), obsahuje vše z Pro.
    trenink: U Free, Pro a Max ve výchozím stavu ano, dá se vypnout v Settings → Preferences (AI data retention). Enterprise ne.
    zdroje:
      - https://www.chalkbox.org/guides/perplexity-pro-for-students/
      - https://www.perplexity.ai/help-center/en/articles/11187416-which-perplexity-subscription-plan-is-right-for-you
      - https://www.perplexity.ai/help-center/en/articles/12590157-what-is-education-pro
      - https://www.perplexity.ai/help-center/en/articles/11680686-perplexity-max
      - https://www.perplexity.ai/help-center/en/articles/11564572-data-collection-at-perplexity
      - https://www.perplexity.ai/hub/legal/terms-of-service

zahranicni_platby: Tarify v USD a EUR platíte zahraniční firmě — viz stránka Zahraniční platby pro neplátce DPH.
