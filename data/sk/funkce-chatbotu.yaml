# Slovenská verze data/funkce-chatbotu.yaml (stránka /sk/funkce/zmeny-2026 a tabulky na dalších stránkách).
# Fakta, data a zdroje jsou stejné jako v české verzi; při aktualizaci měň oba soubory.
# Štítek „končí“ musí zůstat přesně takto (MaticeFunkci.astro podle něj barví odznak) — ve slovenštině je stejný.
stav_k: '2026-11-15'
zdroj: Artefakt „Funkcie chatbotov 2027“ (AI dětem), overené v oficiálnych nápovedách vývojárov 13. 10. 2026, časť údajov aktualizovaná 15. 11. 2026, zdieľanie projektov v ChatGPT len v rámci domény, vyvolanie zručností (Gemini a ChatGPT zavináčom, Claude lomkou) a dostupnosť zručností v ChatGPT (od Plus) a Copilote (len licencia M365 Copilot) upravené 20. 11. 2026
poznamka: Výhľad na rok 2027 vychádza len z toho, čo vývojári oznámili do 13. 10. 2026. Pri Copilote „zadarmo“ = Copilot Chat so školským alebo pracovným účtom. Dostupnosť sa líši podľa krajiny a nastavenia správcu.
nastroje:
- id: chatgpt
  nazev: ChatGPT
  vyrobce: OpenAI
  posun: GPTs sa menia na pluginy
  konci:
  - 'Vlastné GPTs: 11. 12. 2026'
  - 'Canvas: skončil 28. 5. 2026'
  - 'ChatGPT agent: zrušený v lete 2026'
  pribyva:
  - Pluginy a zručnosti namiesto GPTs
  - ChatGPT Work na samostatnú prácu (platené tarify)
  - Sites na weby a malé aplikácie (platené tarify)
  - ChatGPT for Teens pre 13–17 rokov
  skola:
  - Prevedený plugin je súkromný. Vlastné akcie, výber modelu ani zdieľanie sa neprenesú.
  - 'Verejný odkaz na GPT zatiaľ nič nenahrádza: zdieľaný projekt ukáže všetkým členom všetky konverzácie, pluginy len so zručnosťami OpenAI do verejného adresára teraz neprijíma.'
  - ChatGPT for Teachers je len pre vyučujúcich v USA.
- id: gemini
  nazev: Gemini
  vyrobce: Google
  posun: Gems sa menia na zručnosti
  konci:
  - 'Gems: osobné účty len na čítanie od 17. 11. 2026, vymazanie 17. 12. 2026; firmy najskôr 1. 3. 2027, školy najskôr 1. 6. 2027'
  - 'Gems v Google Classroom: so školským termínom'
  - 'Opal a Gems z Google Labs: 17. 11. 2026'
  pribyva:
  - Zručnosti vo formáte SKILL.md, nahranie aj stiahnutie ako ZIP
  - Notebooky prepojené s Gemini Notebook
  - Workspace Studio; Gemini agent pre firmy zatiaľ bez termínu
  skola:
  - Gems sa prevedú len na koncepty zručností. Autor ich musí skontrolovať a zapnúť.
  - Zručnosti zatiaľ nefungujú s Canvasom, Deep Research ani Guided Learning a nedajú sa zadať v Classroom.
  - 'Vek pri zručnostiach: dokumentácia pre správcov uvádza všetky vekové kategórie, nápoveda Gemini 18+. Overte si to na žiackom účte.'
- id: copilot
  nazev: Copilot
  vyrobce: Microsoft
  posun: K agentom pribúdajú pluginy
  konci:
  - 'App Builder: 30. 11. 2026'
  - 'Tlačidlo Agenti v menu: do konca novembra 2026 ho nahradia Pluginy'
  - 'Deep Research v osobnom Copilote: skončil 18. 8. 2026'
  pribyva:
  - Pluginy a zručnosti, Cowork prijme aj balíky z Claude
  - Home, Code a Autopilot (zatiaľ v programe Frontier)
  - Pamäť a Notebooks aj bez platenej licencie
  skola:
  - Cowork môžu v škole používať vyučujúci a zamestnanci s licenciou Microsoft 365 Copilot, navyše sa platia kredity. Žiaci a študenti ho používať nesmú.
  - Agenta nemožno zdieľať mimo školy. Inej škole odovzdáte len návod.
  - 'Zadarmo so školskou licenciou: Study and Learn (od 13 rokov), Teach a Notebooks.'
- id: claude
  nazev: Claude
  vyrobce: Anthropic
  posun: Chat pracuje samostatne
  konci:
  - Žiadna funkcia nemá ohlásený koniec.
  pribyva:
  - Samostatná práca priamo v chate od 16. 9. 2026 (Pro, Max, Ultra, neskôr Team a Enterprise)
  - Docs, Slides a Design vo všetkých tarifoch od 8. 10. 2026
  - Verejný adresár pluginov od 25. 9. 2026
  skola:
  - Len pre používateľov od 18 rokov, žiacky program neexistuje.
  - Projekt ani zručnosť sa nedajú poslať odkazom. Zručnosť sa odovzdáva ako ZIP.
  - Pluginy, Research a naplánované úlohy sú len v platených tarifoch.
