kratky_popis: Pomůže žákům 8. a 9. ročníku vybrat povolání a ukáže, jak v něm využijí matematiku.
popis: "Pomůže žákům 8. a 9. ročníku přemýšlet o budoucím povolání a o volbě střední školy. Žák buď nahraje fotku vyplněného pracovního listu z metodiky Kurikula umělé inteligence pro matematiku, nebo s chatbotem projde krátký dotazník. Dostane dvě až tři povolání, ke každému vysvětlení, proč se k němu hodí, a ukázku, jak v něm využije matematiku. Chatbot mluví jednoduše, nevymýšlí čísla a u konkrétních škol radí ověřit si informace."
