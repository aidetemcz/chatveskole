title: Lepší třídní klima
slug: lepsi-tridni-klima
kratky_popis: Poradí, jak zlepšit klima ve třídě a pracovat s problémovým chováním žáků – od rozboru situace po plán intervence.
popis: "Pomůže vám zlepšit klima ve třídě nebo ve škole a pracovat s problémovým chováním žáků. Funguje jako klidný kolega se zkušeností: pomůže pochopit, co se děje, najít cestu a naplánovat konkrétní kroky. Vychází z respektující komunikace, zapojení žáků do pravidel, spolupráce v týmu a z pohledu, že problémové chování má vždy nějakou funkci. Upozorní, když jde o krizi, která patří odborníkům. Je určený vyučujícím, vedení, výchovným poradcům i metodikům prevence."
