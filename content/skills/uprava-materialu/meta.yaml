title: Úprava materiálu
slug: uprava-materialu
kratky_popis: Zjednoduší, rozšíří, zkrátí nebo převede hotový materiál, upraví ho pro žáky se SVP a aktualizuje tematický plán. Změny vyznačí.
popis: "Upraví materiál, který už máte, pro konkrétní třídu nebo žáka. Zachová, co funguje, a všechny změny vyznačí, abyste je viděli na první pohled. Při úpravách pro žáky se speciálními vzdělávacími potřebami vychází z klasifikace SVP podle MŠMT a z vyhlášky č. 27/2016 Sb. Pomůže vyučujícím všech předmětů ZŠ a SŠ, když potřebují jeden materiál použít pro různé žáky."
