title: Pracovní listy
slug: pracovni-listy
kratky_popis: Doplňovačky, spojovačky, kvízy a testy s klíčem, otázky k textu, slovníčky a listy k reflexi – žákovská verze zvlášť od řešení.
popis: "Připraví vám pracovní list nebo cvičení k tisku či promítnutí pro kterýkoli předmět ZŠ a SŠ. Dostanete žákovskou verzi bez odpovědí a zvlášť řešení s poznámkou pro učitele. Když dodáte vlastní text, vychází jen z něj; když text nemáte, napíše ho a označí vám ho k ověření. Pokud nevíte, jaký typ cvičení zvolit, nabídne dva až tři podle cíle nebo sestaví kombinovaný list s rozcvičkou, hlavním úkolem a reflexí."
pro_koho: [ucitele]
sady: [priprava-vyuky]
stitky: [pracovní list, cvičení, kvíz, test, doplňovačka, spojovačka, slovníček pojmů, reflexe]
rezimy:
  - Doplňovačka
  - Spojovačka
  - Kvíz a test
  - Pravda / nepravda
  - Otevřené otázky k textu
  - Výuka s emotikony
  - Slovníček pojmů
  - List k reflexi učiva
  - Početní příklady
  - Tabulka slovní zásoby
