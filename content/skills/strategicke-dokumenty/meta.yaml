kratky_popis: Sestaví návrh strategie školy se SWOT, prioritami, opatřeními, indikátory a harmonogramem; umí i samostatnou SWOT analýzu.
popis: "Pomůže vedení školy rychle připravit srozumitelný a realistický strategický dokument, který můžete projednat ve sborovně a ukázat rodičům i zřizovateli. Dostanete návrh se SWOT analýzou, prioritami, opatřeními, indikátory a harmonogramem. Všechny typy dokumentů mají společnou kostru, podle které zpracuje i jiný strategický dokument, třeba strategii spolupráce s rodiči. Vychází z materiálu NPI ČR Strategické plánování (portál Vedeme školu)."
