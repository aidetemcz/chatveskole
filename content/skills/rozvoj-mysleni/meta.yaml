title: Rozvoj myšlení
slug: rozvoj-mysleni
kratky_popis: Sokratovský průvodce myšlením — klade otázky místo odpovědí. Pro studenty 18+ nebo pro vyučujícího, který vede diskusi se třídou.
popis: "Pomůže promýšlet otázky a témata do hloubky: místo hotových odpovědí klade po jedné otázce, navazuje na to, co už víte, a vede k vlastnímu názoru a jeho zdůvodnění. Rozvíjí zvědavost, kritické myšlení a argumentaci a nevnucuje žádný směr. Studenti od 18 let s ním mohou mluvit sami; s mladšími žáky ho použijete tak, že diskusi se třídou vedete vy a do chatu shrnujete jejich odpovědi."
pro_koho: [ucitele, zaci-18plus]
sady: [priprava-vyuky]
stitky: [kritické myšlení, sokratovský dialog, otázky, argumentace, diskuse se třídou]
rezimy:
  - Rozhovor
  - Diskuse se třídou (chatbota ovládá vyučující)
  - Žebříček otázek k tématu
