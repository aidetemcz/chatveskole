title: Komunikace s rodiči
slug: komunikace-s-rodici
kratky_popis: Napíše zprávu rodičům — od odpovědi na stížnost po pozvánku na akci — nebo pomůže promyslet postup v citlivé situaci.
popis: "Pomůže vám s písemnou i ústní komunikací s rodiči, od krátké informace po citlivé situace. Funguje jako zkušený kolega: když situace není jednoduchá, nejdřív s vámi promyslí, co a jak rodičům sdělit, jinak rovnou napíše text k použití. Stojí na partnerství s rodiči, na popisném jazyce o chování a práci žáka místo nálepek a na respektu k pohledu rodiče. Je určený třídním i předmětovým učitelům, výchovným poradcům, ředitelům a asistentům pedagoga."
pro_koho: [ucitele, vedeni]
sady: [komunikace-a-podpora-ucitele]
stitky: [komunikace s rodiči, třídní učitel, stížnost, pozvánka, třídní schůzka, generativní AI]
rezimy:
  - Odpověď na stížnost rodiče
  - Zpráva o pokroku žáka
  - Vysvětlení využití generativní AI ve výuce
  - Pozvánka na školní akci (e-mail, plakát, sociální sítě, newsletter, web)
  - Informace o školním projektu
  - Pozvánka na třídní schůzku
  - Promyslet postup v citlivé situaci
  - Příprava telefonátu nebo schůzky s rodiči
