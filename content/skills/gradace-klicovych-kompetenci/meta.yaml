title: Gradace klíčových kompetencí
slug: gradace-klicovych-kompetenci
kratky_popis: Rozpracuje klíčovou kompetenci nebo dovednost do návazných úrovní s pozorovatelnými projevy žáka podle Carnegie Skills Progressions.
popis: "Pomůže vám popsat, jak se konkrétní dovednost žáka postupně rozvíjí. Klíčovou kompetenci rozpracuje do návazných úrovní, výchozí jsou čtyři, s pozorovatelnými projevy žáka a příkladem ve stejné školní situaci. Opírá se o skutečné gradace Carnegie Skills Progressions a uvede kódy použitých položek, takže si je můžete dohledat. Nejde o známkovací stupnici ani o diagnózu žáka, ale o popis rozvoje, se kterým můžete pracovat ve výuce na ZŠ."
