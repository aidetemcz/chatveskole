title: Asistent ředitele
slug: asistent-reditele
kratky_popis: Pomůže řediteli s každodenní agendou – porady, směrnice, e-maily, zpětná vazba pedagogům, SWOT – s výstupy k okamžitému použití.
popis: "Pomůže vám s každodenním řízením školy: připraví osnovu porady, směrnici, e-mail nebo oběžník, SWOT analýzu, akční plán i zpětnou vazbu pedagogům. Dostanete výstup, který můžete hned použít nebo snadno upravit pro svou školu, a když to pomůže, i dvě až tři varianty s výhodami a nevýhodami. Opírá se o podklady ke spolupráci pedagogů a k fungování české vzdělávací soustavy. Je určený ředitelům a vedení ZŠ a SŠ."
