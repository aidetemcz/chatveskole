title: Školní pravidla
slug: skolni-pravidla
kratky_popis: Pomůže vytvořit nebo upravit srozumitelná a férová školní pravidla, pravidla pro využívání AI i desatero pro žáky.
popis: "Pomůže vám vytvořit nová školní pravidla nebo zkontrolovat a vylepšit ta, která už máte. Dbá na to, aby byla stručná, srozumitelná všem, férová a vymahatelná a aby vznikala v dialogu se školní komunitou. Pravidla pro využívání AI opírá o doporučení NPI „Jak na AI ve škole“ (2025). Dostanete i návrh, jak pravidla zavést a jak je průběžně vyhodnocovat a aktualizovat."
