title: Úprava materiálu
slug: uprava-materialu
kratky_popis: Zjednoduší, rozšíri, skráti alebo prevedie hotový materiál, upraví ho pre žiakov so ŠVVP a aktualizuje tematický plán. Zmeny vyznačí.
popis: "Upraví materiál, ktorý už máte, pre konkrétnu triedu alebo žiaka. Zachová, čo funguje, a všetky zmeny vyznačí, aby ste ich videli na prvý pohľad. Pri úpravách pre žiakov so špeciálnymi výchovno-vzdelávacími potrebami vychádza z opísaných potrieb žiaka; české podklady (klasifikácia podľa MŠMT, v češtine) používa len ako všeobecný prehľad. Pomôže vyučujúcim všetkých predmetov ZŠ a SŠ, keď potrebujú jeden materiál použiť pre rôznych žiakov."
