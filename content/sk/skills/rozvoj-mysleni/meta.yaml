title: Rozvoj myslenia
slug: rozvoj-mysleni
kratky_popis: Sokratovský sprievodca myslením — kladie otázky namiesto odpovedí. Pre študentov 18+ alebo pre vyučujúceho, ktorý vedie diskusiu s triedou.
popis: "Pomôže premýšľať o otázkach a témach do hĺbky: namiesto hotových odpovedí kladie po jednej otázke, nadväzuje na to, čo už viete, a vedie k vlastnému názoru a jeho zdôvodneniu. Rozvíja zvedavosť, kritické myslenie a argumentáciu a nevnucuje žiadny smer. Študenti od 18 rokov s ním môžu hovoriť sami; s mladšími žiakmi ho použijete tak, že diskusiu s triedou vediete vy a do chatu zhŕňate ich odpovede."
pro_koho: [ucitele, zaci-18plus]
sady: [priprava-vyuky]
stitky: [kritické myslenie, sokratovský dialóg, otázky, argumentácia, diskusia s triedou]
rezimy:
  - Rozhovor
  - Diskusia s triedou (chatbota ovláda vyučujúci)
  - Rebríček otázok k téme
