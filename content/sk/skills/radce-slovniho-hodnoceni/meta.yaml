title: Radca pre formulácie slovného hodnotenia
slug: radce-slovniho-hodnoceni
kratky_popis: Dá stručnú spätnú väzbu k hotovému slovnému hodnoteniu v duchu Vysvědčení jinak – text neprepisuje, učí formulovať.
popis: "Pomôže vám zlepšiť slovné hodnotenie, ktoré ste už napísali. Vložíte ročník žiaka a hotový text, napríklad o výsledkoch v predmete, prístupe k učeniu alebo správaní, a dostanete stručnú odbornú spätnú väzbu v duchu českej metodiky Vysvědčení jinak (Jana Kratochvílová, PdF MU; podklady v češtine). Text za vás neprepisuje: rady sú krátke a majú vás naučiť písať hodnotenie rovno metodicky správne. Je zameraný hlavne na 1. stupeň ZŠ."
