title: Vzdelávacie ciele
slug: vzdelavaci-cile
kratky_popis: Formuluje vzdelávacie ciele podľa Novej taxonómie (Marzano a Kendall) s kontextom učenia a kritériom splnenia.
popis: "Pomôže vám formulovať vzdelávacie ciele pre formatívne hodnotenie podľa Novej taxonómie vzdelávacích cieľov (Marzano a Kendall). Cieľ hovorí, čo žiak s vedomosťou urobí, a je pozorovateľný, takže vy aj žiak spoznáte, či ho dosiahol, a môžete naň naviazať kritériá hodnotenia. Ku každému cieľu dostanete kontext učenia a kritérium splnenia. Využijete ho pri plánovaní hodín aj pri písaní školského vzdelávacieho programu."
