title: Aktivity s chatbotom
slug: aktivity-s-chatbotem
kratky_popis: Navrhne aktivitu, v ktorej sa žiaci rozprávajú s chatbotom – bezpečný prompt pre žiakov a krátky návod pre vyučujúcich podľa cieľa hodiny.
popis: "Pomôže vám navrhnúť aktivitu, v ktorej sa žiaci s chatbotom naozaj niečo naučia. Najprv s vami ujasní cieľ hodiny a podľa neho vyberie vzorec, napríklad kvíz, hádanie pojmu, rozhovor s osobnosťou alebo textovú hru. Dostanete hotový prompt pre žiakov s bezpečnostnými pravidlami, krátke zadanie pre žiakov a návod pre vyučujúcich. Poradí aj podľa veku žiakov: keď nespĺňajú vekovú hranicu nástroja, navrhne vedenie aktivity na projektore alebo aplikáciu Tiny."
