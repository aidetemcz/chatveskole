title: Kritériá hodnotenia
slug: kriteria-hodnoceni
kratky_popis: Z cieľa podľa Novej taxonómie vytvorí kritériá hodnotenia pre vyučujúcich aj žiakov, vrátane úprav pre žiakov so ŠVVP.
popis: "Pomôže vám k vzdelávaciemu cieľu vytvoriť prehľadné a konkrétne kritériá hodnotenia. Cieľ posúdi podľa Novej taxonómie vzdelávacích cieľov (Marzano a Kendall), určí jeho úroveň a proces a prípadne navrhne spresnenie. Dostanete zvyčajne tri kritériá, každé v znení pre vyučujúcich a zrozumiteľne pre žiakov v prvej osobe („Porovnám…“). Hodí sa ako podklad pre formatívne hodnotenie aj sebahodnotenie žiakov."
