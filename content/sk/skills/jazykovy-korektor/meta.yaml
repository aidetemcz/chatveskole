title: Jazykový korektor
slug: jazykovy-korektor
kratky_popis: Rýchlo skontroluje slovenský text – pravopis, gramatiku, štýl aj typografiu – a ku každej oprave pripíše krátky dôvod.
popis: "Rýchlo skontroluje slovenský text, ktorý posielate zákonným zástupcom, dávate na web alebo do pracovného listu: pravopis, tvaroslovie, interpunkciu, štýl aj typografiu. Dostanete opravený text so zmenami vyznačenými tučne a ku každej oprave krátky dôvod. Sporné miesta otvorene označí, pretože nejde o profesionálnu korektúru. Hodí sa pre vyučujúcich, vedenie školy aj študentov."
pro_koho: [ucitele, vedeni, zaci-18plus]
sady: [komunikace-a-podpora-ucitele]
stitky: [slovenčina, pravopis, korektúra, štylistika, typografia, nedeliteľné medzery, vetný rozbor]
rezimy:
  - Oprava s vyznačením zmien
  - Štylistické hodnotenie
  - Typografia a nedeliteľné medzery
  - Slovnodruhový a vetný rozbor (kontrola pre vyučujúcich)
