kratky_popis: Pomôže premyslieť AI gramotnosť v ŠkVP podľa kompetenčného modelu AI dětem – zmapuje pokrytie a navrhne výkony a učivo.
popis: "Pomôže vám premietnuť AI gramotnosť do školského vzdelávacieho programu naprieč predmetmi, nielen v informatike. Vychádza z kompetenčného modelu Kurikula umelej inteligencie pre ZŠ a SŠ, ktorý vytvoril český spolok AI dětem s NPI ČR: štyri oblasti po troch kompetenciách od porozumenia AI po jej dosahy na spoločnosť. Dostanete prehľad, čo ŠkVP už pokrýva, a návrh výkonov, učiva a aktivít. Je určená koordinátorom ŠkVP, vedeniu školy a predmetovým komisiám. Podklady k zručnosti sú v češtine."
