title: Školské pravidlá
slug: skolni-pravidla
kratky_popis: Pomôže vytvoriť alebo upraviť zrozumiteľné a férové školské pravidlá, pravidlá na využívanie AI aj desatoro pre žiakov.
popis: "Pomôže vám vytvoriť nové školské pravidlá alebo skontrolovať a vylepšiť tie, ktoré už máte. Dbá na to, aby boli stručné, zrozumiteľné všetkým, férové a vymáhateľné a aby vznikali v dialógu so školskou komunitou. Pravidlá na využívanie AI opiera o odporúčanie českého NPI „Jak na AI ve škole“ (2025, v češtine). Dostanete aj návrh, ako pravidlá zaviesť a ako ich priebežne vyhodnocovať a aktualizovať."
