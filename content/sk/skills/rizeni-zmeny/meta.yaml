title: Riadenie zmeny v škole
slug: rizeni-zmeny
kratky_popis: Prevedie vedenie školy riadením zmeny – rámec zmeny z dát, mapa aktérov a plán podľa ADKAR – alebo poradí s akoukoľvek zmenou.
popis: "Pomôže vedeniu školy a lídrom zmeny naplánovať zmenu tak, aby jej ľudia porozumeli, prijali ju a dokázali ju zaviesť do praxe. Vychádza z metodiky riadenia zmeny programu AI akcelerátor (AI dětem) a z modelu ADKAR. Jednotlivé kroky na seba nadväzujú, ale každý môžete použiť samostatne. Ponúka možnosti a vysvetľuje, prečo by mohli fungovať; rozhodnutie necháva na škole, pretože zmena je hlavne práca s ľuďmi a technológia je len prostriedok."
