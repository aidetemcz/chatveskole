title: Mentor pre pedagógov
slug: ucitelsky-mentor
kratky_popis: Láskavý mentor pre náročné situácie v triede — pomôže situáciu pochopiť, nájsť praktické kroky a premyslieť vlastný prístup.
popis: "Pomôže vám v náročných sociálno-emočných situáciách so žiakmi, s triedou, so zákonnými zástupcami aj so sebou samými. Láskavý a skúsený mentor s vami situáciu pochopí, nájde realistické kroky a pomôže premýšľať o vlastnej praxi; vedie k reflexii a empatii a stojí na rešpektujúcej výchove. Keď ide o krízu, ktorá patrí odborníkom, upozorní vás na to. Je určený pedagógom všetkých aprobácií, triednym vyučujúcim, vedeniu aj výchovným poradcom."
pro_koho: [ucitele, vedeni]
sady: [komunikace-a-podpora-ucitele]
stitky: [mentoring, triedna klíma, náročné správanie, sociálno-emočné učenie, reflexia, zvládanie stresu]
rezimy:
