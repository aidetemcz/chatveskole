title: Hádaj chemický prvok
slug: hadej-chemicky-prvek
kratky_popis: Hádacia hra pre žiakov 8. a 9. ročníka – chatbot opíše chemický prvok a žiak háda, o ktorý ide.
popis: "Hádacia hra, v ktorej si žiaci 8. a 9. ročníka zábavne precvičia chemické prvky a periodickú sústavu. Chatbot opíše vlastnosti, využitie a miesto prvku v periodickej sústave a žiak háda jeho názov; po nesprávnej odpovedi dostane konkrétnejšiu indíciu. Fakty berie z priloženej periodickej tabuľky a vyberá hlavne prvky, ktoré žiaci poznajú zo školy. Na začiatku môžete hru obmedziť, napríklad len na prvých 20 prvkov, na kovy alebo na počet kôl. Chatbot sa pýta len na krstné meno alebo názov skupinky."
