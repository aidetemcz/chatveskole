title: Komunikácia so zákonnými zástupcami
slug: komunikace-s-rodici
kratky_popis: Napíše správu zákonným zástupcom — od odpovede na sťažnosť po pozvánku na podujatie — alebo pomôže premyslieť postup v citlivej situácii.
popis: "Pomôže vám s písomnou aj ústnou komunikáciou so zákonnými zástupcami, od krátkej informácie po citlivé situácie. Funguje ako skúsený kolega: keď situácia nie je jednoduchá, najprv s vami premyslí, čo a ako zákonným zástupcom oznámiť, inak rovno napíše text na použitie. Stojí na partnerstve so zákonnými zástupcami, na opisnom jazyku o správaní a práci žiaka namiesto nálepiek a na rešpekte k pohľadu zákonného zástupcu. Je určený triednym aj predmetovým vyučujúcim, výchovným poradcom, riaditeľom a asistentom učiteľa."
pro_koho: [ucitele, vedeni]
sady: [komunikace-a-podpora-ucitele]
stitky: [komunikácia so zákonnými zástupcami, triedny vyučujúci, sťažnosť, pozvánka, triedne aktívum, generatívna AI]
rezimy:
  - Odpoveď na sťažnosť zákonného zástupcu
  - Správa o pokroku žiaka
  - Vysvetlenie využitia generatívnej AI vo vyučovaní
  - Pozvánka na školské podujatie (e-mail, plagát, sociálne siete, newsletter, web)
  - Informácia o školskom projekte
  - Pozvánka na triedne aktívum
  - Premyslieť postup v citlivej situácii
  - Príprava telefonátu alebo stretnutia so zákonnými zástupcami
