title: Gradácia kľúčových kompetencií
slug: gradace-klicovych-kompetenci
kratky_popis: Rozpracuje kľúčovú kompetenciu alebo zručnosť do nadväzujúcich úrovní s pozorovateľnými prejavmi žiaka podľa Carnegie Skills Progressions.
popis: "Pomôže vám opísať, ako sa konkrétna zručnosť žiaka postupne rozvíja. Kľúčovú kompetenciu rozpracuje do nadväzujúcich úrovní, predvolene štyroch, s pozorovateľnými prejavmi žiaka a príkladom v rovnakej školskej situácii. Opiera sa o skutočné gradácie Carnegie Skills Progressions a uvedie kódy použitých položiek, takže si ich môžete dohľadať. Nejde o známkovaciu stupnicu ani o diagnózu žiaka, ale o opis rozvoja, s ktorým môžete pracovať vo vyučovaní na ZŠ."
