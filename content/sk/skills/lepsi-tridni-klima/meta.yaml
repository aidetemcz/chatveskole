title: Lepšia triedna klíma
slug: lepsi-tridni-klima
kratky_popis: Poradí, ako zlepšiť klímu v triede a pracovať s problémovým správaním žiakov – od rozboru situácie po plán intervencie.
popis: "Pomôže vám zlepšiť klímu v triede alebo v škole a pracovať s problémovým správaním žiakov. Funguje ako pokojný kolega so skúsenosťami: pomôže pochopiť, čo sa deje, nájsť cestu a naplánovať konkrétne kroky. Vychádza z rešpektujúcej komunikácie, zapojenia žiakov do pravidiel, spolupráce v tíme a z pohľadu, že problémové správanie má vždy nejakú funkciu. Upozorní, keď ide o krízu, ktorá patrí odborníkom. Je určený vyučujúcim, vedeniu, výchovným poradcom aj koordinátorom prevencie."
