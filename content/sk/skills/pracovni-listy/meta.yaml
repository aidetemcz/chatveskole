title: Pracovné listy
slug: pracovni-listy
kratky_popis: Doplňovačky, spájačky, kvízy a testy s kľúčom, otázky k textu, slovníčky a listy na reflexiu – žiacka verzia zvlášť od riešenia.
popis: "Pripraví vám pracovný list alebo cvičenie na tlač či premietanie pre ktorýkoľvek predmet ZŠ a SŠ. Dostanete žiacku verziu bez odpovedí a zvlášť riešenie s poznámkou pre vyučujúcich. Keď dodáte vlastný text, vychádza len z neho; keď text nemáte, napíše ho a označí vám ho na overenie. Ak neviete, aký typ cvičenia zvoliť, ponúkne dva až tri podľa cieľa alebo zostaví kombinovaný list s rozcvičkou, hlavnou úlohou a reflexiou."
pro_koho: [ucitele]
sady: [priprava-vyuky]
stitky: [pracovný list, cvičenie, kvíz, test, doplňovačka, spájačka, slovníček pojmov, reflexia]
rezimy:
  - Doplňovačka
  - Spájačka
  - Kvíz a test
  - Pravda / nepravda
  - Otvorené otázky k textu
  - Vyučovanie s emotikonmi
  - Slovníček pojmov
  - List na reflexiu učiva
  - Počtové príklady
  - Tabuľka slovnej zásoby
