title: Asistent riaditeľa
slug: asistent-reditele
kratky_popis: Pomôže riaditeľovi s každodennou agendou – porady, smernice, e-maily, spätná väzba pedagógom, SWOT – s výstupmi na okamžité použitie.
popis: "Pomôže vám s každodenným riadením školy: pripraví osnovu porady, smernicu, e-mail alebo obežník, SWOT analýzu, akčný plán aj spätnú väzbu pedagógom. Dostanete výstup, ktorý môžete hneď použiť alebo ľahko upraviť pre svoju školu, a keď to pomôže, aj dva až tri varianty s výhodami a nevýhodami. Opiera sa o príručku k spolupráci pedagógov. Je určený riaditeľom a vedeniu ZŠ a SŠ."
