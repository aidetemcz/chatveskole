title: Gradácia kritérií hodnotenia (J–Č–T–Ú)
slug: gradace-kriterii-hodnoceni
kratky_popis: Ku kritériám hodnotenia navrhne gradáciu J–Č–T–Ú na sebahodnotenie žiakov a sebahodnotiaci list „Ako sa mi darilo?“.
popis: "Pomôže vám rozpísať kritériá hodnotenia do úrovní, podľa ktorých sa žiaci sami ohodnotia. Používa štvorúrovňovú škálu J–Č–T–Ú z českej metodiky Vysvědčení jinak (Pedagogická fakulta MU v Brne), od „ešte neosvojené“ po „úplne osvojené“. Úrovne sú písané v prvej osobe jazykom, ktorému žiaci daného veku rozumejú, a na želanie dostanete aj sebahodnotiaci list „Ako sa mi darilo?“. Nejde o známky, ale o to, aby žiaci lepšie videli, ako sa im v učení darí. Podklady k zručnosti sú v češtine."
