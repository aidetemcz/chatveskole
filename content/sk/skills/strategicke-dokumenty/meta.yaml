title: Strategické dokumenty
slug: strategicke-dokumenty
kratky_popis: Zostaví návrh stratégie školy so SWOT, prioritami, opatreniami, indikátormi a harmonogramom; zvládne aj samostatnú SWOT analýzu.
popis: "Pomôže vedeniu školy rýchlo pripraviť zrozumiteľný a realistický strategický dokument, ktorý môžete prerokovať v zborovni a ukázať zákonným zástupcom aj zriaďovateľovi. Dostanete návrh so SWOT analýzou, prioritami, opatreniami, indikátormi a harmonogramom. Všetky typy dokumentov majú spoločnú kostru, podľa ktorej spracuje aj iný strategický dokument, napríklad stratégiu spolupráce so zákonnými zástupcami. Vychádza z materiálu českého NPI Strategické plánování (portál Vedeme školu, v češtine)."
pro_koho: [vedeni]
sady: [vedeni-skoly]
stitky: [strategické plánovanie, SWOT, digitálna gramotnosť, inklúzia, digitálny wellbeing, hodnotenie, kvalita vyučovania, inovácie]
