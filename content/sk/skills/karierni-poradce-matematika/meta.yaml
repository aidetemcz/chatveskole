kratky_popis: Pomôže žiakom 8. a 9. ročníka vybrať si povolanie a ukáže, ako v ňom využijú matematiku.
popis: "Pomôže žiakom 8. a 9. ročníka premýšľať o budúcom povolaní a o výbere strednej školy. Žiak buď nahrá fotku vyplneného pracovného listu z metodiky Kurikula umelej inteligencie pre matematiku (v češtine), alebo s chatbotom prejde krátky dotazník. Dostane dve až tri povolania, ku každému vysvetlenie, prečo sa k nemu hodí, a ukážku, ako v ňom využije matematiku. Chatbot hovorí jednoducho, nevymýšľa čísla a pri konkrétnych školách radí overiť si informácie."
