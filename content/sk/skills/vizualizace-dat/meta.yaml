title: Vizualizácia dát
slug: vizualizace-dat
kratky_popis: Prevedie školské a projektové dáta do presných a zrozumiteľných grafov, tabuliek a prehľadov s hlavným zistením.
popis: "Pomôže vám previesť školské a projektové dáta, napríklad známky, výsledky testov, dotazníky alebo dochádzku, do presných a zrozumiteľných grafov, tabuliek a prehľadov. Ku každému výstupu dostanete hlavné zistenie: čo sa zmenilo, ako veľmi, koho sa to týka a prečo je to dôležité, aj s obmedzeniami výkladu. Dáta neupravuje ani nedopočítava bez označenia a nevytvára zavádzajúce porovnania. Výstupy sa hodia pre zborovňu, zákonných zástupcov, zriaďovateľa aj donorov; mená žiakov z dát vopred odstráňte."
