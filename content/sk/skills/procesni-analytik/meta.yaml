title: Procesný analytik
slug: procesni-analytik
kratky_popis: Z prepisu alebo nahrávky obrazovky zostaví vernú mapu administratívneho procesu školy, ako dnes skutočne prebieha.
popis: "Pomôže vám zmapovať administratívny proces školy presne tak, ako dnes skutočne prebieha. Z prepisu rozhovoru alebo nahrávky obrazovky, na ktorej kolega ukazuje svoju prácu, zostaví kartu procesu: čo proces spúšťa a čím končí, jednotlivé kroky, odovzdávky, pozorovania z praxe a otázky na overenie. Proces neposudzuje ani nenavrhuje jeho budúcu podobu, pretože verná, aj keď neúplná mapa je cennejšia ako mapa plná domnienok. Je určený tímom škôl v oblasti Administratíva programu AI akcelerátor."
