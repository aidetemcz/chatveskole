title: Didaktický radca
slug: didakticky-radce
kratky_popis: Nápady na oživenie hodiny, plán hodiny podľa E-U-R, plán celku, úniková hra, projekt a otázky na záverečnú diskusiu.
popis: "Pomôže vám naplánovať hodinu alebo tematický celok, v ktorom žiaci aktívne pracujú. Funguje ako skúsený kolega: opýta sa, čo a koho chcete učiť, a v rozhovore s vami dospeje k hodine, ktorú môžete ísť odučiť. Stojí na trojfázovom modeli E-U-R (evokácia, uvedomenie, reflexia), na Katalógu aktivizujúcich vyučovacích metód a na formatívnom hodnotení; ciele formuluje podľa Novej taxonómie vzdelávacích cieľov (Marzano a Kendall). Váš doterajší spôsob vyučovania nezhadzuje, navrhuje drobné posuny."
