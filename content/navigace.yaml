# Výrazné tlačítko v hlavičce (mimo rozbalovací menu)
cta: { title: Katalog skills, href: /skills }

# Stránky generované z dat (nejsou .md v content/stranky):
generovane:
  - { href: /skills, zdroj: content/skills/*/ + content/sady.yaml, popis: katalog skills s filtrem podle sady a pro koho }
  - { href: "/skills/[slug]", zdroj: content/skills/<slug>/, popis: detail skillu — popis, režimy, Kopírovat prompt, Stáhnout ZIP, Google Docs, původní asistenti }
  - { href: "/sady/[slug]", zdroj: content/sady.yaml, popis: rozcestník sady (= plugin), u formativního hodnocení i odkaz na metodiku }
  - { href: /funkce/prompty, zdroj: content/stranky/funkce/prompty.md + content/prompty/*/, popis: stránka Prompty s databází promptů (skupiny pedagogove, zaci, archiv-2024) }
  - { href: "/funkce/prompty/[slug]", zdroj: "content/prompty/pedagogove/<slug>.md, content/prompty/archiv-2024/<slug>.md" }
  - { href: /funkce/prompty/zaci, zdroj: content/prompty/zaci/_index.md }
  - { href: "/funkce/prompty/zaci/[slug]", zdroj: content/prompty/zaci/<slug>.md }
